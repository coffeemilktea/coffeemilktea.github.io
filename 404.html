<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Healthcare Data Tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#1e1815" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3e7d6" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/assets/tokens.css">
  <script src="/tools/theme.js"></script>
  <script src="/vendor/htmx.min.js" defer></script>
  <style>
    /* Palette and shared chrome come from /assets/tokens.css. */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); font-family: var(--font-sans);
      line-height: 1.6; padding: 24px;
    }
    .site-bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 20px; background: var(--surface);
    }
    .card {
      max-width: 460px; width: 100%; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 44px 36px;
    }
    .code {
      font-family: var(--font-mono); font-size: 3rem; font-weight: 700;
      color: var(--accent); margin: 0 0 4px; letter-spacing: -0.02em;
    }
    h1 { font-size: 1.15rem; margin: 0 0 10px; }
    p { color: var(--body); font-size: 0.9rem; margin: 0 0 24px; }
    .msh {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 12px; margin: 0 0 28px; overflow-wrap: anywhere;
    }
    a.btn {
      display: inline-block;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: var(--radius); padding: 10px 22px; text-decoration: none;
      font-weight: 600; font-size: 0.9rem;
    }
    a.btn:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); border-color: var(--accent); }

    /* ── htmx-loaded tool list (shared fragment with the landing page) ── */
    .jump { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
    /* Stay invisible until the fragment actually lands (or if JS is off). */
    .jump:not(:has(.tool-links)) { display: none; }
    .jump h2 {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
      margin: 0 0 12px;
    }
    .tool-links {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .tool-links a {
      display: inline-block; color: var(--body); text-decoration: none;
      font-size: 0.78rem; border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; transition: color .15s, border-color .15s;
    }
    .tool-links a:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <nav class="site-bar" aria-label="Site">
    <a class="site-brand" href="/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5h12l-1.3 12.6a1.6 1.6 0 0 1-1.6 1.4H8.9a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M4.6 7.5h14.8"/><path d="M13.6 7.5V3.2l2.9-1.1"/><circle cx="10.2" cy="17.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="13.8" cy="17.4" r="1.05" fill="currentColor" stroke="none"/><circle cx="12" cy="19.7" r="1.05" fill="currentColor" stroke="none"/></svg> coffeemilktea.github.io</a>
    <span class="spacer"></span>
    <button class="btn-theme" id="btn-theme" type="button"><span class="theme-icon">☀️</span><span class="theme-label">Light</span></button>
  </nav>

  <main class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <p class="msh">MSA|AE|404^Page not found^HTTP</p>
    <a class="btn" href="/">Back to the tools</a>

    <!-- The tool list, shared as one fragment so it cannot drift from the site. -->
    <div class="jump" hx-get="/partials/tool-links.html" hx-trigger="load" hx-swap="beforeend">
      <h2>Jump straight to a tool</h2>
    </div>
  </main>
</body>
</html>
